# 129834 Rafael José Capucho da Silva
name: Qodana smell gate 129834

on:
  pull_request:
  push:
    branches: [qodana-129834]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-129834:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha}}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:

          args: --config qodana-129834.yaml
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
          upload-result: true