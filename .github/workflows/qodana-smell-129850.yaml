# 129850 - Gonçalo Sobral
name: Qodana smell gate 129850

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-129850:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129850.yaml
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
          upload-result: true