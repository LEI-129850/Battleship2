# 129843 - Martim Correia
name: Qodana smell gate 129843
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129843.yaml
          pr-mode: false
          use-annotations: true
          post-pr-comment: true
          upload-result: true